name: Feature request
description: Suggest a feature or improvement for MOTION
title: "[Feature] "
body:
  - type: textarea
    id: request
    attributes:
      label: What feature would you like?
      placeholder: Describe the feature and why it would be useful.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux
        - Both
    validations:
      required: true
